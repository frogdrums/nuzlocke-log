<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Nuzlocke Log</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16241b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nuzlocke Log">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #16241b;
    --panel: #1f3327;
    --panel-raised: #294634;
    --lcd: #9bbc0f;
    --lcd-dim: #4f7942;
    --cream: #e8dcc4;
    --cream-dim: #9c9584;
    --dead: #c9524f;
    --dead-dim: #6b332f;
    --gold: #d4af37;
    --line: #3a5641;
    --lcd-rgb: 155,188,15;
    --bezel-top: #223a2b;
    --frame-border: #0d1712;
    --frame-ring: #2f4a37;
    --radius: 3px;
  }
  /* Renegade Platinum gets its own palette — cool blue/grey/teal instead of
     Emerald's GBA green, so the two games are visually distinct at a
     glance. Toggled by renderAll() setting data-game on <body>. Adding a
     future game the same way: define its own body[data-game="..."] block
     here, no other CSS needs to change since every component is themed
     entirely through these custom properties. */
  body[data-game="renegade"]{
    --bg: #141e26;
    --panel: #1d2e3a;
    --panel-raised: #274252;
    --lcd: #4fd6c7;
    --lcd-dim: #2c7d75;
    --cream: #dbe8ec;
    --cream-dim: #85a0ac;
    --dead: #d1685f;
    --dead-dim: #5c332f;
    --gold: #d9a856;
    --line: #2f4653;
    --lcd-rgb: 79,214,199;
    --bezel-top: #1c2e3a;
    --frame-border: #0a1418;
    --frame-ring: #24404d;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(255,255,255,0.025) 1px, transparent 0);
    background-size: 3px 3px;
    color: var(--cream);
    font-family: 'JetBrains Mono', monospace;
    min-height: 100vh;
    padding: calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }
  .pixel{ font-family: 'Press Start 2P', monospace; }

  /* ---------- top bezel ---------- */
  .device{
    max-width: 640px;
    margin: 0 auto;
    border: 3px solid var(--frame-border);
    border-radius: 10px;
    background: linear-gradient(180deg, var(--bezel-top) 0%, var(--bg) 40px, var(--bg) 100%);
    box-shadow: 0 0 0 1px var(--frame-ring), 0 10px 30px rgba(0,0,0,0.5);
    overflow: hidden;
  }
  .screen-header{
    padding: 16px 16px 10px;
    border-bottom: 2px solid var(--line);
    background: repeating-linear-gradient(180deg, rgba(var(--lcd-rgb),0.04) 0px, rgba(var(--lcd-rgb),0.04) 1px, transparent 1px, transparent 3px);
  }
  .title-row{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; flex-wrap:wrap;}
  .title-row h1{
    font-size: 17px;
    color: var(--lcd);
    margin: 0;
    letter-spacing: 0.5px;
    text-shadow: 0 0 6px rgba(var(--lcd-rgb),0.35);
  }
  .led{
    display:inline-block; width:7px; height:7px; border-radius:50%;
    background: var(--lcd); box-shadow: 0 0 5px var(--lcd);
    margin-right: 6px; vertical-align: middle;
  }
  .game-select-wrap{ margin-top: 10px; }
  select.game-select{
    width:100%; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    color: var(--lcd); font-family:'JetBrains Mono',monospace; font-size: 14px; font-weight:700;
    letter-spacing: 0.5px; text-transform: uppercase; padding: 7px 8px; outline:none;
  }
  select.game-select:focus{ border-color: var(--lcd); }
  .run-name-wrap{ margin-top: 10px; }
  input.run-name{
    background: transparent; border:none; border-bottom: 1px dashed var(--line);
    color: var(--cream); font-family:'JetBrains Mono',monospace; font-size: 19px; font-weight:700;
    padding: 4px 2px; width: 100%; outline:none;
  }
  input.run-name::placeholder{ color: var(--cream-dim); }
  input.run-name:focus{ border-bottom-color: var(--lcd); }

  /* ---------- badges strip ---------- */
  .badges{
    display:flex; gap:7px; margin-top:12px; flex-wrap: wrap;
  }
  .badge{
    width: 26px; height:26px; border-radius:50%;
    border: 2px solid var(--line);
    background: var(--panel);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    font-size: 15px; color: var(--cream-dim);
    transition: all .15s ease;
    flex-shrink:0;
  }
  .badge.on{
    background: radial-gradient(circle at 35% 30%, #f3d873, var(--gold) 70%);
    border-color: #a5822a;
    color: #3a2c05;
    box-shadow: 0 0 8px rgba(212,175,55,0.6);
  }

  /* ---------- rules row ---------- */
  .rules{
    display:flex; gap:14px; flex-wrap:wrap; margin-top:12px;
    font-size: 14px; color: var(--cream-dim);
  }
  .rules label{ display:flex; align-items:center; gap:5px; cursor:pointer; }
  .rules input{ accent-color: var(--lcd); }

  /* ---------- stats strip ---------- */
  .stats{
    display:grid; grid-template-columns: repeat(4,1fr); gap:1px;
    background: var(--line);
    border-top: 2px solid var(--line);
    border-bottom: 2px solid var(--line);
  }
  .stat{
    background: var(--panel); padding: 10px 6px; text-align:center;
  }
  .stat .n{ font-size: 22px; font-weight:700; color: var(--lcd); }
  .stat .l{ font-size: 12px; color: var(--cream-dim); text-transform:uppercase; letter-spacing: 0.5px; margin-top:3px; }

  /* ---------- tabs ---------- */
  .tabs{ display:flex; }
  .tab{
    flex:1; text-align:center; padding: 11px 4px; font-size: 14px;
    background: var(--bg); color: var(--cream-dim); cursor:pointer;
    border-bottom: 2px solid var(--line); letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .tab.active{ background: var(--panel); color: var(--lcd); border-bottom-color: var(--lcd); }

  .content{ padding: 14px 16px 20px; }

  /* ---------- add form ---------- */
  .add-form{
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px; margin-bottom: 16px;
  }
  .add-form .row{ display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
  .add-form .row > div{ flex:1; min-width: 110px; }
  label.f{ display:block; font-size: 13px; color: var(--cream-dim); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:4px; }
  input[type=text], input[type=number], select{
    width:100%; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius);
    color: var(--cream); font-family:'JetBrains Mono',monospace; font-size: 17px; padding: 7px 8px; outline:none;
  }
  input:focus, select:focus{ border-color: var(--lcd); }
  select{ appearance:none; -webkit-appearance:none; background-image: linear-gradient(45deg, transparent 50%, var(--cream-dim) 50%), linear-gradient(135deg, var(--cream-dim) 50%, transparent 50%); background-position: calc(100% - 14px) center, calc(100% - 9px) center; background-size: 5px 5px, 5px 5px; background-repeat:no-repeat;}
  button{
    font-family:'JetBrains Mono',monospace; cursor:pointer; border-radius: var(--radius);
    border: 1px solid var(--line); background: var(--panel-raised); color: var(--cream);
    padding: 8px 12px; font-size: 16px; font-weight:700;
  }
  button:active{ transform: translateY(1px); }
  .btn-primary{ background: var(--lcd-dim); border-color: var(--lcd); color: #0d1712; width:100%; padding:10px; font-size: 16px; }
  .btn-primary:hover{ background: var(--lcd); }
  .btn-danger{ background: var(--dead-dim); border-color: var(--dead); color:#fff; }
  .btn-ghost{ background:transparent; }

  /* ---------- roster cards ----------
     3-per-row (roughly — auto-fill reflows by actual width) grid of
     compact tiles instead of one full-width row per mon, so a long run
     doesn't turn into an endless vertical scroll. Not grouped by route —
     a Nuzlocke rarely has more than one active mon per route, so a
     per-route grid would mostly be groups of one; route shows on the
     card itself instead (.route-tag). */
  .route-cards, #graveyardList{
    display:grid; grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); gap: 8px;
  }
  .card{
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 8px 9px; display:flex; flex-direction:column; gap:3px; min-width:0;
  }
  .card.status-dead{ opacity: 0.75; border-left: 3px solid var(--dead); }
  .card.status-alive{ border-left: 3px solid var(--lcd); }
  .card.status-boxed{ border-left: 3px solid var(--cream-dim); }
  .card-top{ display:flex; align-items:center; gap:5px; min-width:0; }
  .dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .dot.status-alive{ background: var(--lcd); box-shadow: 0 0 5px var(--lcd); }
  .dot.status-dead{ background: var(--dead); box-shadow: 0 0 5px var(--dead); }
  .dot.status-boxed{ background: var(--cream-dim); }
  .nick{ font-weight:700; font-size: 13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .species{ color: var(--cream-dim); font-size: 11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .route-tag{
    font-size: 9.5px; color: var(--gold); text-transform:uppercase; letter-spacing:0.3px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .meta{ font-size: 10.5px; color: var(--cream-dim); }
  .meta b{ color: var(--cream); }
  .card-actions{ display:flex; gap:4px; flex-wrap:wrap; margin-top:3px; }
  .card-actions button{ font-size: 13px; padding: 4px 3px; flex:1; min-width: 0; line-height:1; }
  .cause{ font-size: 10.5px; color: var(--dead); font-style: italic; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .empty{ text-align:center; color: var(--cream-dim); font-size: 15px; padding: 30px 10px; border: 1px dashed var(--line); border-radius: var(--radius); }

  /* ---------- checklist ---------- */
  .checklist-note{
    font-size: 14px; color: var(--cream-dim); background: var(--panel);
    border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; margin-bottom: 12px;
    line-height: 1.5;
  }
  .cl-card{
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 10px 12px; margin-bottom: 8px;
  }
  .cl-card.done{ border-left: 3px solid var(--lcd); }
  .cl-card.pending{ border-left: 3px solid var(--gold); }
  .cl-top{ display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .cl-name{ font-weight:700; font-size: 17px; }
  .cl-status{ font-size: 13px; text-transform:uppercase; letter-spacing:0.5px; padding: 3px 7px; border-radius: 10px; flex-shrink:0; }
  .cl-status.done{ background: var(--lcd-dim); color: #0d1712; }
  .cl-status.pending{ background: transparent; border: 1px solid var(--gold); color: var(--gold); }
  .cl-species{ display:flex; flex-wrap:wrap; gap:5px; margin-top:5px; }
  .cl-method{ font-size: 13px; color: var(--gold); text-transform: uppercase; letter-spacing: 0.4px; margin-top: 9px; }
  .cl-toggle{ margin-top: 9px; font-size: 14px; padding: 6px 10px; width: 100%; background: var(--panel-raised); border-color: var(--line); cursor: pointer; border-radius: var(--radius); color: var(--cream); font-family: 'JetBrains Mono', monospace; }
  .cl-collapsed .cl-toggle{ background: var(--lcd-dim); color: #0d1712; font-weight: 700; border-color: var(--lcd); }
  .cl-card.cl-collapsed{ opacity: 0.7; }
  .cl-method:first-of-type{ margin-top: 8px; }
  .chip-lv{ opacity: 0.75; font-size: 12px; }
  .chip-time{ opacity: 0.75; font-size: 12px; color: var(--gold); font-style: italic; }
  .chip{
    font-size: 13px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
    padding: 5px 9px; color: var(--cream-dim); cursor: pointer; font-family:'JetBrains Mono',monospace;
    -webkit-tap-highlight-color: transparent;
  }
  .chip:active{ transform: scale(0.96); }
  .chip-caught{ background: var(--lcd-dim); border-color: var(--lcd); color: #0d1712; font-weight:700; }

  /* ---------- boss battles ---------- */
  .boss-section-title{
    font-size: 14px; color: var(--gold); text-transform:uppercase; letter-spacing:0.5px;
    margin: 16px 0 8px; border-bottom: 1px dashed var(--line); padding-bottom: 4px;
  }
  .boss-section-title:first-child{ margin-top: 0; }
  .trainer-location{
    font-size: 13px; color: var(--cream-dim); text-transform:uppercase; letter-spacing:0.5px;
    margin: 10px 0 6px;
  }
  .trainer-location:first-of-type{ margin-top: 2px; }
  .split-header{
    display:flex; justify-content:space-between; align-items:baseline; cursor:pointer;
    font-size: 14px; color: var(--gold); text-transform:uppercase; letter-spacing:0.5px;
    margin: 16px 0 8px; border-bottom: 1px dashed var(--line); padding-bottom: 4px;
    -webkit-tap-highlight-color: transparent;
  }
  .split-header:first-child{ margin-top: 0; }
  .split-caret{ font-size: 12px; flex-shrink:0; }
  .split-header.split-collapsed{ color: var(--cream-dim); border-bottom-style: solid; }
  .boss-card{
    background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--gold);
    border-radius: var(--radius); padding: 10px 12px; margin-bottom: 8px;
  }
  .boss-top{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .boss-name{ font-weight:700; font-size: 17px; }
  .boss-cap{ font-size: 14px; color: var(--gold); font-weight:700; flex-shrink:0; }
  .boss-meta{ font-size: 14px; color: var(--cream-dim); margin-top:3px; }
  .boss-items{ font-size: 14px; color: var(--gold); margin-top: 4px; font-weight: 600; }
  .boss-team{ font-size: 14px; color: var(--cream); margin-top:5px; line-height:1.5; }
  .boss-note{ font-size: 13px; color: var(--cream-dim); margin-top:5px; font-style: italic; line-height:1.4; }
  .boss-toggle{ margin-top: 9px; font-size: 14px; padding: 6px 10px; width: 100%; background: var(--panel-raised); border-color: var(--line); }
  .boss-beaten{ opacity: 0.65; }
  .boss-beaten .boss-toggle{ background: var(--lcd-dim); color: #0d1712; font-weight: 700; border-color: var(--lcd); }
  .boss-mon{ background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 7px 9px; margin-top: 6px; }
  .boss-mon-top{ display:flex; justify-content:space-between; font-size: 15px; font-weight:700; }
  .boss-mon-meta{ font-size: 13px; color: var(--cream-dim); margin-top: 2px; }
  .boss-mon-moves{ font-size: 13px; color: var(--cream); margin-top: 3px; line-height: 1.4; }
  .boss-mon-stats{ font-size: 13px; color: var(--lcd); margin-top: 4px; font-weight: 700; letter-spacing: 0.2px; }
  .boss-summary{ font-size: 14px; color: var(--cream-dim); margin-top: 6px; font-style: italic; line-height: 1.4; }

  /* ---------- guide tab ---------- */
  .guide-subtabs{ display:flex; gap:6px; margin-bottom: 12px; flex-wrap: wrap; }
  .guide-subtab{
    font-size: 14px; padding: 6px 10px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--panel); color: var(--cream-dim); cursor: pointer;
  }
  .guide-subtab.active{ background: var(--lcd-dim); color: #0d1712; border-color: var(--lcd); font-weight: 700; }
  .guide-card{
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 10px 12px; margin-bottom: 8px;
  }
  .guide-card-title{ font-weight:700; font-size: 16px; color: var(--lcd); margin-bottom: 4px; }
  .guide-card-body{ font-size: 15px; color: var(--cream); line-height: 1.5; }
  .nature-table{ width:100%; border-collapse: collapse; font-size: 14px; }
  .nature-table th{ text-align:left; color: var(--cream-dim); font-size: 13px; text-transform:uppercase; padding: 4px 6px; border-bottom: 1px solid var(--line); }
  .nature-table td{ padding: 5px 6px; border-bottom: 1px solid var(--line); }
  .nature-table tr:nth-child(even){ background: var(--panel-raised); }
  .ev-up{ color: var(--lcd); }
  .ev-down{ color: var(--dead); }

  /* ---------- footer ---------- */
  .footer{
    display:flex; gap:8px; padding: 12px 16px 16px; border-top: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .footer button{ flex:1; font-size: 14px; }
  #fileInput{ display:none; }

  .toast{
    position: fixed; bottom: 18px; left:50%; transform: translateX(-50%);
    background: var(--panel-raised); border:1px solid var(--lcd); color: var(--lcd);
    padding: 9px 16px; border-radius: var(--radius); font-size: 15px;
    opacity:0; pointer-events:none; transition: opacity .25s ease, transform .25s ease;
    z-index: 50;
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(-4px); }

  /* ---------- in-page confirm/prompt modal ----------
     Replaces window.confirm()/prompt(): some embedded/preview webviews
     (and possibly some installed-PWA contexts) block or silently no-op
     native blocking dialogs, which made Mark Fainted/Delete/Reset Run
     appear to do nothing. This is fully in-DOM instead. */
  .modal-overlay{
    position: fixed; inset: 0; background: rgba(13,23,18,0.72);
    display:flex; align-items:center; justify-content:center; padding: 20px;
    opacity:0; pointer-events:none; transition: opacity .15s ease; z-index: 100;
  }
  .modal-overlay.show{ opacity:1; pointer-events:auto; }
  .modal-box{
    background: var(--panel-raised); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px; max-width: 360px; width:100%; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .modal-msg{ font-size: 15px; color: var(--cream); line-height: 1.5; margin-bottom: 12px; }
  .modal-input{
    width:100%; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius);
    color: var(--cream); font-family:'JetBrains Mono',monospace; font-size: 17px; padding: 7px 8px;
    outline:none; margin-bottom: 12px;
  }
  .modal-input:focus{ border-color: var(--lcd); }
  .modal-actions{ display:flex; gap:8px; }
  .modal-actions button{ flex:1; }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; }
  }
</style>
</head>
<body>

<div class="device">
  <div class="screen-header">
    <div class="title-row">
      <h1 class="pixel"><span class="led"></span>NUZLOCKE LOG</h1>
    </div>
    <div class="game-select-wrap">
      <select class="game-select" id="gameSelect"></select>
    </div>
    <div class="run-name-wrap">
      <input class="run-name" id="runName" type="text" placeholder="Name this run… e.g. Emerald Solo Run">
    </div>
    <div class="badges" id="badges"></div>
    <div class="rules" id="rulesRow">
      <label><input type="checkbox" data-rule="species"> Species clause</label>
      <label><input type="checkbox" data-rule="dupes"> Dupes clause</label>
      <label><input type="checkbox" data-rule="shiny"> Shiny clause</label>
      <label><input type="checkbox" data-rule="nickname"> Nickname required</label>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><div class="n" id="statTotal">0</div><div class="l">Encounters</div></div>
    <div class="stat"><div class="n" id="statAlive">0</div><div class="l">Alive</div></div>
    <div class="stat"><div class="n" id="statDead">0</div><div class="l">Fallen</div></div>
    <div class="stat"><div class="n" id="statBadges">0/8</div><div class="l">Badges</div></div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="roster">Route Log</div>
    <div class="tab" data-tab="checklist">Encounters</div>
    <div class="tab" data-tab="bosses">Bosses</div>
    <div class="tab" data-tab="trainers">Trainers</div>
    <div class="tab" data-tab="guide">Guide</div>
    <div class="tab" data-tab="graveyard">Graveyard</div>
  </div>

  <div class="content">

    <div id="panel-roster">
      <div class="add-form">
        <div class="row">
          <div>
            <label class="f">Route / Location</label>
            <input type="text" id="fRoute" placeholder="Route 3">
          </div>
          <div>
            <label class="f">Species</label>
            <input type="text" id="fSpecies" placeholder="Pidgey">
          </div>
        </div>
        <div class="row">
          <div>
            <label class="f">Nickname</label>
            <input type="text" id="fNick" placeholder="Gale">
          </div>
          <div style="max-width:90px; flex:0 0 90px;">
            <label class="f">Level</label>
            <input type="number" id="fLevel" placeholder="5" min="1" max="100">
          </div>
        </div>
        <button class="btn-primary" id="addBtn">+ Add Encounter</button>
      </div>

      <div id="rosterList"></div>
    </div>

    <div id="panel-checklist" style="display:none;">
      <div class="checklist-note" id="checklistNote"></div>
      <div id="checklistList"></div>
    </div>

    <div id="panel-bosses" style="display:none;">
      <div id="bossesList"></div>
    </div>

    <div id="panel-trainers" style="display:none;">
      <div class="checklist-note" id="trainersNote"></div>

  var EMERALD_TIPS = [
    { title: "Good Rod location", body: "Given by the fisherman in the house on Route 118, right next to Mauville. Old Rod comes earlier from a fisherman on Route 118 too; Super Rod comes from the house on Route 105 (Mr. Briney's area)." },
    { title: "Devon Scope", body: "Given by Devon Corp in Rustboro after you deliver the Devon Goods. Lets you see and battle the two hidden Kecleon on Route 119 and Route 120." },
    { title: "Move Relearner", body: "House in Fallarbor Town. For one Heart Scale, re-teaches a Pokémon any level-up move it currently knows how to learn but has forgotten or evolved past — great for recovering an early move an evolution overwrote." },
    { title: "Move Deleter", body: "House up the ladder next to the Pokémon Center in Lilycove City. Free to use — deletes any single move except Surf, including HMs, without affecting happiness." },
    { title: "Move tutors (different from the two above)", body: "One-time-use tutors are scattered through the game and teach a specific bonus move for free — each can only be used once per playthrough. The two repeatable tutors in the Battle Frontier area teach moves for Battle Points (BP) instead of Heart Scales, and can be used as many times as you have BP." },
    { title: "Best move tutors to seek out", body: "Of the Battle Frontier's repeatable BP tutor pool, the standouts: Dragon Claw (reliable STAB with no drawback for Dragon-types), Rock Slide (great coverage move, flinch chance), Sky Attack (strong Flying STAB before TM alternatives), Substitute (stalling/setup tool), Bulk Up (Attack+Defense boost for physical sweepers), and Dynamic Punch (guaranteed confusion if it lands). Worth saving BP for these over the flashier but more situational options." },
    { title: "Held items worth grabbing", body: "Amulet Coin (Slateport, after helping the old man on Route 104), King's Rock (Route 119, Trick House gift), Lucky Egg (postgame, Battle Tower staff)." },
    { title: "Heart Scale locations", body: "Hidden items (need the Itemfinder) on Route 104, Route 105, Route 106, and Lilycove City — one each. Underwater Route 124 has two, and Route 128 has three. Route 106's is on the southeast side, Lilycove's is south of the department store — worth a sweep once you have Dive and the Itemfinder, since the Move Relearner eats one per use." }
  ];

  var EMERALD_CHEATS = [
    { title: "Pomeg Glitch (EV reset)", body: "Feeding a Pomeg/Kelpsy/Grepa/Hondew/Qualot Berry can reduce a stat to 0 if the Pokémon's level is low enough relative to its EVs, letting you re-train EVs from scratch without breeding a new one. Legitimate in-game mechanic, not a cheat device, but very few players know about it." },
    { title: "Cloning glitch (Battle Tower/link cable)", body: "Trading a Pokémon and canceling the trade at the right moment during the animation (or disconnecting a link cable at the right frame) duplicates the Pokémon and its held item. Well-documented Gen 3 glitch — useful for cloning a Master Ball or a rare catch, but does require a second GBA/cartridge or an emulator link setup." },
    { title: "Coin Case duplication", body: "An old, patched-in-later-games glitch involving the Coin Case and Game Corner; largely irrelevant in Emerald since it was fixed here. Mentioned for completeness — don't rely on it." },
    { title: "Infinite Rare Candy / infinite money", body: "There's no built-in vanilla-cartridge glitch for infinite Rare Candies in Emerald; the closest legitimate approaches are: (1) the Cloning Glitch above to duplicate a stack you already own, or (2) Action Replay/GameShark codes if you're playing on an emulator or flashcart with cheat support. Since this breaks the entire point of a Nuzlocke's resource scarcity, I'd think hard before using these even if available." },
    { title: "Action Replay codes (emulator only)", body: "If you're on an emulator and want to experiment outside of a serious Nuzlocke run, common Emerald AR codes include Rare Candy count/quantity modifiers, walk-through-walls, and encounter modifiers. These require a code database (e.g. from a ROM-hacking community) and only work in emulators/flashcarts that support cheat codes — not on unmodified real hardware." },

  // ---------- game registry ----------
  // Each game bundles its own guide/boss/guide-tab data plus the section
  // labels that vary per game (rival name, evil team name, etc.). Adding a
  // new game means: duplicate a *_GUIDE/*_BOSSES/*_TIPS/*_CHEATS/*_EV_SPOTS
  // set above, add an entry here, and push its id onto GAME_ORDER. No
  // render/UI code needs to change — see "Extending to a new game" in
  // ../CLAUDE.md.
  var GAMES = {
    emerald: {
      id: "emerald",
      label: "Pokémon Emerald",
      shortLabel: "Emerald",
      guide: EMERALD_GUIDE,
      guideComplete: true, // whole game done — Checklist note can say "All N locations"
      bosses: EMERALD_BOSSES,
      trainerFights: [], // Emerald folds every trainer into Bosses; no separate split data
      // Guide subtabs are per-game because the sections themselves differ,
      // not just their content — Emerald's Tips/Cheats/Natures/EV Spots
      // don't map cleanly onto Renegade's Items/TMs/Gifts&Events, so each
      // game lists its own subtabs here rather than sharing 4 fixed ones.
      guideSections: [
        { key: "tips", label: "Tips", type: "cards", data: EMERALD_TIPS },
        { key: "cheats", label: "Cheats", type: "cards", data: EMERALD_CHEATS,
          intro: "A Nuzlocke is built around scarcity, so use your judgment here — most of these are documented curiosities more than things worth using mid-run." },
        { key: "natures", label: "Natures", type: "natures", data: NATURE_GUIDE },
        { key: "ev", label: "EV Spots", type: "evspots", data: EV_SPOTS }
      ],
      rivalLabel: "Rival Battles (Treecko path)",
      otherBattlesLabel: "Wally",
      evilTeamLabel: "Team Magma / Aqua"
    },
    renegade: {
      id: "renegade",
      label: "Pokémon Renegade Platinum",
      shortLabel: "Renegade Platinum",
      guide: RENEGADE_GUIDE,
      guideComplete: false, // only the Roark split's locations so far
      bosses: RENEGADE_BOSSES,
      trainerFights: RENEGADE_TRAINER_FIGHTS,
      // Natures are shown directly in-game for Renegade Platinum, so no
      // Natures subtab is needed here (Emerald's UI never shows nature,
      // hence its reference chart). No EV Spots subtab either — nothing
      // extracted for it yet; add one later the same way if it turns out
      // useful for a rebalance romhack where EV yields may differ.
      guideSections: [
        { key: "items", label: "Items", type: "cards", data: RENEGADE_ITEMS },
        { key: "tms", label: "TMs", type: "cards", data: RENEGADE_TMS },
        { key: "gifts", label: "Gifts/Events", type: "cards", data: RENEGADE_GIFTS }
      ],
      rivalLabel: "Rival Battles (Barry)",
      otherBattlesLabel: "Other Battles",
      evilTeamLabel: "Team Galactic"
    }
  };
  var GAME_ORDER = ["emerald", "renegade"];
  var DEFAULT_GAME = "emerald";

  function currentGame(){
    return GAMES[state.selectedGame] || GAMES[DEFAULT_GAME];
  }

  // One run's worth of state — kept per-game (see `runs` below) so
  // switching the game selector switches to a fully separate roster,
  // badges, rules, etc. rather than overwriting a single shared run.
  function defaultRules(){
    return { species:false, dupes:false, shiny:false, nickname:false };
  }
  function defaultRunState(){
    return {
      runName: "",
      badges: 0,
      rules: defaultRules(),
      mons: [], // {id, route, species, nick, level, status, cause, causeLevel, createdAt}
      beatenBosses: {}, // key -> true
      collapsedRoutes: {}, // route name -> true
      collapsedSplits: {} // trainer-fight split name -> true
    };
  }

  function defaultState(){
    var runs = {};
    GAME_ORDER.forEach(function(id){ runs[id] = defaultRunState(); });
    return {
      selectedGame: DEFAULT_GAME,
      runs: runs // gameId -> run state, see defaultRunState()
    };
  }

  // The run currently shown in the UI — the one for whichever game is
  // selected. Creates a fresh run on first visit to a game so older saves
  // (or a newly-added game in GAME_ORDER) never hit a missing run.
  function currentRun(){
    if(!state.runs[state.selectedGame]){
      state.runs[state.selectedGame] = defaultRunState();
    }
    return state.runs[state.selectedGame];
  }

  // Accepts either the current multi-run shape, or an older single-run
  // save/export (flat `mons` array at the top level, from before per-game
  // runs existed) and normalizes both into the current shape. Returns null
  // if `raw` isn't a recognizable save at all.
  function normalizeState(raw){
    if(!raw || typeof raw !== "object") return null;

    function normalizeRun(r){
      r = r || {};
      return {
        runName: r.runName || "",
        badges: typeof r.badges === "number" ? r.badges : 0,
        rules: Object.assign(defaultRules(), r.rules || {}),
        mons: Array.isArray(r.mons) ? r.mons : [],
        beatenBosses: r.beatenBosses || {},
        collapsedRoutes: r.collapsedRoutes || {},
        collapsedSplits: r.collapsedSplits || {}
      };
    }

    if(raw.runs && typeof raw.runs === "object"){
      var out = {
        selectedGame: (raw.selectedGame && GAMES[raw.selectedGame]) ? raw.selectedGame : DEFAULT_GAME,
        runs: {}
      };
      GAME_ORDER.forEach(function(id){ out.runs[id] = normalizeRun(raw.runs[id]); });
      return out;
    }

    if(Array.isArray(raw.mons)){
      // Legacy pre-multi-game save/export: everything was one flat run.
      // Bring it in as the Emerald run (the only game that existed then)
      // and leave other games untouched.
      var legacy = defaultState();
      legacy.selectedGame = DEFAULT_GAME;
      legacy.runs[DEFAULT_GAME] = normalizeRun(raw);
      return legacy;
    }

    return null;
  }

  function load(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var normalized = normalizeState(JSON.parse(raw));
        if(normalized) return normalized;
      }
    }catch(e){ console.warn("Could not load saved run", e); }
    return defaultState();
  }

  function save(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }catch(e){ console.warn("Could not save run", e); }
  }

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function showToast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(showToast._h);
    showToast._h = setTimeout(function(){ t.classList.remove("show"); }, 1800);
  }

  // ---------- in-page confirm/prompt (see .modal-overlay CSS comment) ----------
  function showModal(opts){
    var overlay = document.getElementById("modalOverlay");
    var msgEl = document.getElementById("modalMsg");
    var input = document.getElementById("modalInput");
    var okBtn = document.getElementById("modalOk");
    var cancelBtn = document.getElementById("modalCancel");

    msgEl.textContent = opts.message;
    if(opts.showInput){
      input.style.display = "";
      input.value = "";
      input.placeholder = opts.inputPlaceholder || "";
    } else {
      input.style.display = "none";
    }
    overlay.classList.add("show");

    function cleanup(){
      overlay.classList.remove("show");
      okBtn.removeEventListener("click", onOk);
      cancelBtn.removeEventListener("click", onCancel);
      input.removeEventListener("keydown", onKeydown);
    }
    function onOk(){ cleanup(); opts.onConfirm(opts.showInput ? input.value : true); }
    function onCancel(){ cleanup(); if(opts.onCancel) opts.onCancel(); }
    function onKeydown(e){ if(e.key === "Enter") onOk(); else if(e.key === "Escape") onCancel(); }

    okBtn.addEventListener("click", onOk);
    cancelBtn.addEventListener("click", onCancel);
    input.addEventListener("keydown", onKeydown);
    if(opts.showInput) setTimeout(function(){ input.focus(); }, 10);
  }

  function showConfirm(message, onConfirm){
    showModal({ message: message, showInput: false, onConfirm: onConfirm });
  }

  function showPrompt(message, placeholder, onSubmit){
    showModal({ message: message, showInput: true, inputPlaceholder: placeholder, onConfirm: onSubmit });
  }

  // ---------- rendering ----------
  function renderBadges(){
    var run = currentRun();
    var wrap = document.getElementById("badges");
    wrap.innerHTML = "";
    for(var i=0;i<8;i++){
      var b = document.createElement("div");
      b.className = "badge" + (i < run.badges ? " on" : "");
      b.textContent = (i+1);
      b.title = "Badge " + (i+1);
      (function(idx){
        b.addEventListener("click", function(){
          // clicking toggles up to that badge count
          var r = currentRun();
          if(r.badges === idx+1){ r.badges = idx; }
          else { r.badges = idx+1; }
          save(); renderAll();
        });
      })(i);
      wrap.appendChild(b);
    }
  }

  function renderStats(){
    var run = currentRun();
    var alive = run.mons.filter(function(m){ return m.status==="alive"; }).length;
    var dead = run.mons.filter(function(m){ return m.status==="dead"; }).length;
    document.getElementById("statTotal").textContent = run.mons.length;
    document.getElementById("statAlive").textContent = alive;
    document.getElementById("statDead").textContent = dead;
    document.getElementById("statBadges").textContent = run.badges + "/8";
  }

  function cardHTML(m){
    var statusLabel = m.status === "alive" ? "Active" : (m.status === "boxed" ? "Boxed" : "Fallen");
    var actions = "";
    if(m.status !== "dead"){
      actions += '<button data-act="kill" data-id="'+m.id+'" class="btn-danger" title="Mark Fainted">💀</button>';
    }
    if(m.status === "alive"){
      actions += '<button data-act="box" data-id="'+m.id+'" class="btn-ghost" title="Box">📦</button>';
    }
    if(m.status === "boxed"){
      actions += '<button data-act="unbox" data-id="'+m.id+'" class="btn-ghost" title="Un-box">📤</button>';
    }
    if(m.status === "dead"){
      actions += '<button data-act="revive" data-id="'+m.id+'" class="btn-ghost" title="Undo faint">↩️</button>';
    }
    actions += '<button data-act="delete" data-id="'+m.id+'" class="btn-ghost" title="Delete">🗑️</button>';

    var cause = m.status === "dead" && m.cause ? '<div class="cause" title="'+escapeHTML(m.cause)+'">☠ ' + escapeHTML(m.cause) + '</div>' : "";
    var speciesLine = m.nick ? '<div class="species">'+escapeHTML(m.species || "?")+'</div>' : "";
    // Cards no longer sit under a per-route section header (mons from
    // different routes/encounters now share the same grid — see
    // renderRoster), so the route has to live on the card itself.
    var routeLine = '<div class="route-tag">'+escapeHTML(m.route || "Unknown Location")+'</div>';

    return (
      '<div class="card status-'+m.status+'">' +
        '<div class="card-top">' +
          '<span class="dot status-'+m.status+'"></span>' +
          '<span class="nick">'+escapeHTML(m.nick || m.species || "Unnamed")+'</span>' +
        '</div>' +
        speciesLine +
        routeLine +
        '<div class="meta">'+statusLabel+(m.level ? ' · Lv '+escapeHTML(String(m.level)) : '')+'</div>' +
        cause +
        '<div class="card-actions">'+actions+'</div>' +
      '</div>'
    );
  }

  function escapeHTML(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  // "OGS" -> "O/G/S", "MD" -> "M/D" — used for the rod-tier/time-of-day
  // checklist badges so multi-letter values read as a list, not a word.
  function letterDivide(s){
    return String(s).split("").join("/");
  }

  function routeOrderIndex(routeName){
    var idx = currentGame().guide.findIndex(function(loc){ return loc.name === routeName; });
    return idx === -1 ? 9999 : idx;
  }

  function renderRoster(){
    var alive = currentRun().mons.filter(function(m){ return m.status !== "dead"; });
    var el = document.getElementById("rosterList");
    if(alive.length === 0){
      el.innerHTML = '<div class="empty">No active encounters logged yet.<br>Add your first catch above.</div>';
      return;
    }
    // One flat grid in playthrough order, not one row per route — a real
    // Nuzlocke almost never has more than one active mon per route, so
    // grouping by route defeated the point of the 3-per-row grid (every
    // group would just be a group of one). Array#sort is stable, so mons
    // from the same route (multiple gifts at one town, etc) still land
    // next to each other.
    alive = alive.slice().sort(function(a, b){ return routeOrderIndex(a.route) - routeOrderIndex(b.route); });
    el.innerHTML = '<div class="route-cards">' + alive.map(cardHTML).join("") + '</div>';
  }

  function renderGraveyard(){
    var dead = currentRun().mons.filter(function(m){ return m.status === "dead"; });
    var el = document.getElementById("graveyardList");
    if(dead.length === 0){
      el.innerHTML = '<div class="empty">No losses yet. Long may it last.</div>';
      return;
    }
    dead = dead.slice().reverse();
    el.innerHTML = dead.map(cardHTML).join("");
  }

  function renderAll(){
    var run = currentRun();
    document.body.setAttribute("data-game", state.selectedGame);
    var themeMeta = document.querySelector('meta[name="theme-color"]');
    if(themeMeta) themeMeta.setAttribute("content", state.selectedGame === "renegade" ? "#141e26" : "#16241b");
    document.getElementById("runName").value = run.runName || "";
    document.getElementById("gameSelect").value = state.selectedGame;
    Object.keys(run.rules).forEach(function(k){
      var input = document.querySelector('[data-rule="'+k+'"]');
      if(input) input.checked = !!run.rules[k];
    });
    renderBadges();
    renderStats();
    renderRoster();
    renderChecklist();
    renderBosses();
    renderTrainers();
    renderGuide();
    renderGraveyard();
  }

  // ---------- events ----------
  document.getElementById("runName").addEventListener("input", function(e){
    currentRun().runName = e.target.value; save();
  });

  function populateGameSelect(){
    var sel = document.getElementById("gameSelect");
    sel.innerHTML = GAME_ORDER.map(function(id){
      var g = GAMES[id];
      return '<option value="'+id+'">'+escapeHTML(g.shortLabel)+'</option>';
    }).join("");
  }

  document.getElementById("gameSelect").addEventListener("change", function(e){
    state.selectedGame = e.target.value;
    save();
    renderAll();
  });

  document.getElementById("rulesRow").addEventListener("change", function(e){
    var rule = e.target.getAttribute("data-rule");
    if(rule){ currentRun().rules[rule] = e.target.checked; save(); }
  });

  document.querySelectorAll(".tab").forEach(function(tab){
    tab.addEventListener("click", function(){
      document.querySelectorAll(".tab").forEach(function(t){ t.classList.remove("active"); });
      tab.classList.add("active");
      var which = tab.getAttribute("data-tab");
      document.getElementById("panel-roster").style.display = which === "roster" ? "" : "none";
      document.getElementById("panel-checklist").style.display = which === "checklist" ? "" : "none";
      document.getElementById("panel-bosses").style.display = which === "bosses" ? "" : "none";
      document.getElementById("panel-trainers").style.display = which === "trainers" ? "" : "none";
      document.getElementById("panel-guide").style.display = which === "guide" ? "" : "none";
      document.getElementById("panel-graveyard").style.display = which === "graveyard" ? "" : "none";
    });
  });

  // A location can hold more than one logged mon now (gift + a wild
  // encounter, multiple gifts at one town, etc) — see the mark-species
  // handler below, which no longer enforces one-catch-per-route.
  function findLoggedMonsForRoute(routeName){
    return currentRun().mons.filter(function(m){
      return (m.route || "").trim().toLowerCase() === routeName.toLowerCase();
    });
  }

  function renderChecklist(){
    var game = currentGame();
    var note = document.getElementById("checklistNote");
    var coverage = game.guideComplete
      ? "All " + game.guide.length + " " + game.shortLabel + " locations"
      : game.guide.length + " " + game.shortLabel + " locations extracted so far — more added as later splits are done";
    note.textContent = coverage + ", grouped by method. A badge shows level, or rod tier (O/G/S) and, when a species isn't available all day, time of day (M/D/N). Tap to log a catch — tap again to undo. A location can hold more than one catch (e.g. a gift plus a wild encounter). Logged locations auto-collapse; tap to reopen.";

    var el = document.getElementById("checklistList");
    if(game.guide.length === 0){
      el.innerHTML = '<div class="empty">No guide data loaded yet for ' + escapeHTML(game.shortLabel) + '.</div>';
      return;
    }
    el.innerHTML = game.guide.map(function(loc){
      var loggedMons = findLoggedMonsForRoute(loc.name);
      var logged = loggedMons.length > 0;
      var collapsed = logged && !!currentRun().collapsedRoutes[loc.name];

      if(collapsed){
        var namesStr = loggedMons.map(function(m){ return m.species || "?"; }).join(", ");
        return (
          '<div class="cl-card done cl-collapsed">' +
            '<div class="cl-top">' +
              '<div class="cl-name">'+escapeHTML(loc.name)+'</div>' +
              '<div class="cl-status done">Logged</div>' +
            '</div>' +
            '<button type="button" class="cl-toggle" data-act="toggle-collapse-route" data-route="'+escapeHTML(loc.name)+'">'+escapeHTML(namesStr)+' — tap to expand</button>' +
          '</div>'
        );
      }

      var caughtSpecies = {};
      loggedMons.forEach(function(m){ caughtSpecies[m.species] = true; });

      var groups = {};
      var order = [];
      loc.encounters.forEach(function(e){
        if(!groups[e.m]){ groups[e.m] = []; order.push(e.m); }
        groups[e.m].push(e);
      });

      var groupsHtml = order.map(function(method){
        var chips = groups[method].map(function(e){
          var isCaught = !!caughtSpecies[e.sp];
          var badge = e.tier ? ' <span class="chip-lv">'+escapeHTML(letterDivide(e.tier))+'</span>'
            : ((e.lv && e.lv !== "—") ? ' <span class="chip-lv">Lv '+escapeHTML(e.lv)+'</span>' : '');
          var timeBadge = (e.t && e.t.length < 3) ? ' <span class="chip-time">'+escapeHTML(letterDivide(e.t))+'</span>' : '';
          return '<button type="button" class="chip'+(isCaught?" chip-caught":"")+'" data-act="mark-species" data-route="'+escapeHTML(loc.name)+'" data-species="'+escapeHTML(e.sp)+'">'+(isCaught?"✓ ":"")+escapeHTML(e.sp)+badge+timeBadge+'</button>';
        }).join("");
        return '<div class="cl-method">'+escapeHTML(method)+'</div><div class="cl-species">'+chips+'</div>';
      }).join("");

      return (
        '<div class="cl-card '+(logged?"done":"pending")+'">' +
          '<div class="cl-top">' +
            '<div class="cl-name">'+escapeHTML(loc.name)+'</div>' +
            '<div class="cl-status '+(logged?"done":"pending")+'">'+(logged?"Logged":"Not yet")+'</div>' +
          '</div>' +
          groupsHtml +
          (logged ? '<button type="button" class="cl-toggle" data-act="toggle-collapse-route" data-route="'+escapeHTML(loc.name)+'">Collapse</button>' : '') +
        '</div>'
      );
    }).join("");
  }

  // Gen 3 base stats [HP, Atk, Def, SpA, SpD, Spe] for species appearing in
  // confirmed boss stat blocks. Used to compute real numeric stats from the
  // decomp's exact IV values (0 EVs, neutral nature assumed — trainer Pokémon
  // don't have a clean exposed nature in the simplified trainer struct).
  var BASE_STATS = {
    "Geodude": [40,80,100,30,30,20],
    "Nosepass": [30,45,135,45,90,30],
    "Machop": [70,80,50,35,35,35],
    "Meditite": [30,40,55,40,55,60],
    "Makuhita": [72,60,30,20,30,25],
    "Voltorb": [40,30,50,55,55,100],
    "Electrike": [40,45,40,65,40,65],
    "Magneton": [50,60,95,120,70,70],
    "Manectric": [70,75,60,105,60,105],
    "Numel": [60,60,40,65,45,35],
    "Slugma": [40,40,40,70,40,20],
    "Camerupt": [70,100,70,105,75,40],
    "Torkoal": [70,85,140,85,70,20],
    "Spinda": [60,60,60,60,60,60],
    "Vigoroth": [80,80,80,55,55,90],
    "Linoone": [78,70,61,50,61,100],
    "Slaking": [150,160,100,95,65,100],
    "Swablu": [45,40,60,40,75,50],
    "Tropius": [99,68,83,72,87,51],
    "Pelipper": [60,50,100,85,70,65],
    "Skarmory": [65,80,140,40,70,70],
    "Altaria": [75,70,90,70,105,80]
  };

  function computeStat(base, iv, level, isHP){
    var val = Math.floor(((2*base + iv) * level) / 100);
    return isHP ? (val + level + 10) : (val + 5);
  }

  function statLineHTML(m){
    var hp, atk, def, spa, spd, spe, approxNote = "";
    if(m.stats){
      hp = m.stats[0]; atk = m.stats[1]; def = m.stats[2]; spa = m.stats[3]; spd = m.stats[4]; spe = m.stats[5];
    } else {
      var base = BASE_STATS[m.name];
      if(!base || typeof m.iv !== "number") return "";
      var iv = m.iv, lvl = m.level;
      hp = computeStat(base[0], iv, lvl, true);
      atk = computeStat(base[1], iv, lvl, false);
      def = computeStat(base[2], iv, lvl, false);
      spa = computeStat(base[3], iv, lvl, false);
      spd = computeStat(base[4], iv, lvl, false);
      spe = computeStat(base[5], iv, lvl, false);
      approxNote = m.ivApprox ? " (IV estimated)" : " (estimated)";
    }
    return '<div class="boss-mon-stats">HP '+hp+' · Atk '+atk+' · Def '+def+' · SpA '+spa+' · SpD '+spd+' · Spe '+spe+approxNote+'</div>';
  }

  function monBlockHTML(m){
    return (
      '<div class="boss-mon">' +
        '<div class="boss-mon-top"><span>'+escapeHTML(m.name)+'</span><span>Lv. '+m.level+'</span></div>' +
        '<div class="boss-mon-meta">Ability: '+escapeHTML(m.ability)+' · Item: '+escapeHTML(m.item)+'</div>' +
        '<div class="boss-mon-moves">'+escapeHTML(m.moves)+'</div>' +
        statLineHTML(m) +
      '</div>'
    );
  }

  function bossCardHTML(key, nameHtml, capHtml, metaHtml, bodyHtml){
    var beaten = !!currentRun().beatenBosses[key];
    if(beaten){
      return (
        '<div class="boss-card boss-beaten">' +
          '<div class="boss-top"><div class="boss-name">'+nameHtml+'</div>'+capHtml+'</div>' +
          '<div class="boss-meta">'+metaHtml+'</div>' +
          '<button type="button" class="boss-toggle" data-act="toggle-beaten" data-key="'+escapeHTML(key)+'">✓ Beaten — tap to expand</button>' +
        '</div>'
      );
    }
    return (
      '<div class="boss-card">' +
        '<div class="boss-top"><div class="boss-name">'+nameHtml+'</div>'+capHtml+'</div>' +
        '<div class="boss-meta">'+metaHtml+'</div>' +
        bodyHtml +
        '<button type="button" class="boss-toggle" data-act="toggle-beaten" data-key="'+escapeHTML(key)+'">Mark Defeated</button>' +
      '</div>'
    );
  }

  function renderBosses(){
    var el = document.getElementById("bossesList");
    var game = currentGame();
    var bosses = game.bosses || {};
    var html = "";

    if(bosses.gymLeaders && bosses.gymLeaders.length){
      html += '<div class="boss-section-title">Gym Leaders &amp; Level Caps</div>';
      bosses.gymLeaders.forEach(function(b){
        var body =
          (b.battleItems ? '<div class="boss-items">Battle items: '+escapeHTML(b.battleItems)+'</div>' : "") +
          (b.mons ? b.mons.map(monBlockHTML).join("") : '<div class="boss-summary">'+escapeHTML(b.teamSummary)+'</div>') +
          (b.tip ? '<div class="boss-note">'+escapeHTML(b.tip)+'</div>' : "");
        html += bossCardHTML("gym-"+b.name, escapeHTML(b.name), '<div class="boss-cap">Cap Lv '+b.cap+'</div>', escapeHTML(b.location)+' · '+escapeHTML(b.type)+'-type', body);
      });
    }

    if(bosses.eliteFour && bosses.eliteFour.length){
      html += '<div class="boss-section-title">Elite Four</div>';
      bosses.eliteFour.forEach(function(b){
        var body =
          (b.mons ? b.mons.map(monBlockHTML).join("") : "") +
          (b.tip ? '<div class="boss-note">'+escapeHTML(b.tip)+'</div>' : "");
        html += bossCardHTML("elite-"+b.name, escapeHTML(b.name), "", escapeHTML(b.type)+'-type specialist', body);
      });
    }

    if(bosses.champion && bosses.champion.name){
      html += '<div class="boss-section-title">Champion</div>';
      (function(){
        var c = bosses.champion;
        var body =
          (c.battleItems && c.battleItems !== "—" ? '<div class="boss-items">Battle items: '+escapeHTML(c.battleItems)+'</div>' : "") +
          (c.mons ? c.mons.map(monBlockHTML).join("") : "") +
          (c.tip ? '<div class="boss-note">'+escapeHTML(c.tip)+'</div>' : "");
        html += bossCardHTML("champion-"+c.name, escapeHTML(c.name), "", escapeHTML(c.location), body);
      })();
    }

    if(bosses.rival && bosses.rival.length){
      html += '<div class="boss-section-title">'+escapeHTML(game.rivalLabel)+'</div>';
      bosses.rival.forEach(function(b){
        var body =
          '<div class="boss-note">'+escapeHTML(b.note)+'</div>' +
          (b.mons ? b.mons.map(monBlockHTML).join("") : (b.teamSummary ? '<div class="boss-summary">'+escapeHTML(b.teamSummary)+'</div>' : ""));
        html += bossCardHTML("rival-"+b.stage, escapeHTML(b.stage), "", escapeHTML(b.location), body);
      });
    }

    if(bosses.otherBattles && bosses.otherBattles.length){
      html += '<div class="boss-section-title">'+escapeHTML(game.otherBattlesLabel)+'</div>';
      bosses.otherBattles.forEach(function(b){
        var body =
          '<div class="boss-note">'+escapeHTML(b.note)+'</div>' +
          (b.mons ? b.mons.map(monBlockHTML).join("") : (b.teamSummary ? '<div class="boss-summary">'+escapeHTML(b.teamSummary)+'</div>' : ""));
        html += bossCardHTML("other-"+b.name+"-"+b.location, escapeHTML(b.name), "", escapeHTML(b.location), body);
      });
    }

    if(bosses.evilTeam && bosses.evilTeam.length){
      html += '<div class="boss-section-title">'+escapeHTML(game.evilTeamLabel)+'</div>';
      bosses.evilTeam.forEach(function(b){
        var body =
          '<div class="boss-note">'+escapeHTML(b.note)+'</div>' +
          (b.mons ? b.mons.map(monBlockHTML).join("") : (b.teamSummary ? '<div class="boss-summary">'+escapeHTML(b.teamSummary)+'</div>' : ""));
        html += bossCardHTML("evil-"+b.name+"-"+b.location, escapeHTML(b.name), "", escapeHTML(b.location), body);
      });
    }

    if(!html){
      html = '<div class="empty">No boss data loaded yet for ' + escapeHTML(game.shortLabel) + '.</div>';
    }

    el.innerHTML = html;
  }

  function renderTrainers(){
    var el = document.getElementById("trainersList");
    var note = document.getElementById("trainersNote");
    var game = currentGame();
    var groups = game.trainerFights || [];

    if(!groups.length){
      note.textContent = "";
      el.innerHTML = '<div class="empty">No trainer fight data loaded yet for ' + escapeHTML(game.shortLabel) + '.</div>';
      return;
    }

    note.textContent = "Regular route and gym trainer battles, split by story checkpoint. Rival, gym leader, and evil-team fights live in the Bosses tab instead.";

    var run = currentRun();
    var html = "";
    groups.forEach(function(g){
      var collapsed = !!run.collapsedSplits[g.split];
      html += '<div class="split-header' + (collapsed ? ' split-collapsed' : '') + '" data-act="toggle-collapse-split" data-split="' + escapeHTML(g.split) + '">' +
        '<span>' + escapeHTML(g.split) + ' Split' + (g.levelCap ? ' · Level Cap ' + g.levelCap : '') + '</span>' +
        '<span class="split-caret">' + (collapsed ? '▸ ' + g.fights.length + ' fights' : '▾') + '</span>' +
      '</div>';
      if(collapsed) return;
      var lastLoc = null;
      g.fights.forEach(function(f, idx){
        if(f.location !== lastLoc){
          html += '<div class="trainer-location">' + escapeHTML(f.location) + '</div>';
          lastLoc = f.location;
        }
        var body = f.mons.map(monBlockHTML).join("");
        var key = "trainer-" + g.split + "-" + f.location + "-" + f.trainerClass + "-" + f.name + "-" + idx;
        html += bossCardHTML(key, escapeHTML(f.trainerClass) + ' ' + escapeHTML(f.name), "", f.note ? escapeHTML(f.note) : "", body);
      });
    });

    el.innerHTML = html;
  }

  // Which guide subtabs a game shows are per-game (GAMES[id].guideSections)
  // since the sections themselves differ — Emerald's Tips/Cheats/Natures/EV
  // Spots vs. Renegade's Items/TMs/Gifts&Events. `activeGuideKey` is
  // transient UI state (not persisted): renderGuide() falls back to that
  // game's first section whenever the current key doesn't belong to it,
  // which covers both first load and switching games.
  var activeGuideKey = null;

  function guideCardsHTML(list, emptyLabel, game, intro){
    var introHtml = intro ? '<div class="guide-card"><div class="guide-card-body">'+escapeHTML(intro)+'</div></div>' : "";
    if(!list.length){
      return introHtml + '<div class="empty">No ' + escapeHTML(emptyLabel) + ' loaded yet for ' + escapeHTML(game.shortLabel) + '.</div>';
    }
    return introHtml + list.map(function(t){
      return '<div class="guide-card"><div class="guide-card-title">'+escapeHTML(t.title)+'</div><div class="guide-card-body">'+escapeHTML(t.body)+'</div></div>';
    }).join("");
  }

  function renderGuideSection(section, game){
    if(section.type === "natures"){
      var rows = section.data.map(function(n){
        return '<tr><td>'+escapeHTML(n.nature)+'</td><td class="'+(n.up!=='—'?'ev-up':'')+'">'+escapeHTML(n.up)+'</td><td class="'+(n.down!=='—'?'ev-down':'')+'">'+escapeHTML(n.down)+'</td></tr>';
      }).join("");
      return '<div class="guide-card"><table class="nature-table"><tr><th>Nature</th><th>Raises</th><th>Lowers</th></tr>' + rows + '</table></div>';
    }
    if(section.type === "evspots"){
      if(!section.data.length) return '<div class="empty">No EV spots loaded yet for ' + escapeHTML(game.shortLabel) + '.</div>';
      return section.data.map(function(e){
        return '<div class="guide-card"><div class="guide-card-title">'+escapeHTML(e.stat)+'</div><div class="guide-card-body"><b>Where:</b> '+escapeHTML(e.spot)+'<br><b>Note:</b> '+escapeHTML(e.note)+'</div></div>';
      }).join("");
    }
    return guideCardsHTML(section.data, section.label.toLowerCase(), game, section.intro);
  }

  function renderGuide(){
    var game = currentGame();
    var sections = game.guideSections || [];
    var subtabsEl = document.getElementById("guideSubtabs");
    var contentEl = document.getElementById("guideContent");

    if(!sections.length){
      subtabsEl.innerHTML = "";
      contentEl.innerHTML = '<div class="empty">No guide content yet for ' + escapeHTML(game.shortLabel) + '.</div>';
      return;
    }

    if(!activeGuideKey || !sections.some(function(s){ return s.key === activeGuideKey; })){
      activeGuideKey = sections[0].key;
    }

    subtabsEl.innerHTML = sections.map(function(s){
      return '<div class="guide-subtab' + (s.key === activeGuideKey ? ' active' : '') + '" data-act="guide-subtab" data-key="' + escapeHTML(s.key) + '">' + escapeHTML(s.label) + '</div>';
    }).join("");

    var active = sections.filter(function(s){ return s.key === activeGuideKey; })[0];
    contentEl.innerHTML = renderGuideSection(active, game);
  }

  document.getElementById("addBtn").addEventListener("click", function(){
    var route = document.getElementById("fRoute").value.trim();
    var species = document.getElementById("fSpecies").value.trim();
    var nick = document.getElementById("fNick").value.trim();
    var level = document.getElementById("fLevel").value.trim();

    if(!species && !nick){
      showToast("Add at least a species or nickname");
      return;
    }
    if(currentRun().rules.nickname && !nick){
      showToast("This run requires a nickname");
      return;
    }

    currentRun().mons.push({
      id: uid(),
      route: route || "Unknown Location",
      species: species,
      nick: nick,
      level: level,
      status: "alive",
      cause: "",
      createdAt: Date.now()
    });
    save();
    document.getElementById("fRoute").value = "";
    document.getElementById("fSpecies").value = "";
    document.getElementById("fNick").value = "";
    document.getElementById("fLevel").value = "";
    document.getElementById("fRoute").focus();
    renderAll();
    showToast("Encounter added");
  });

  function findMon(id){
    return currentRun().mons.find(function(m){ return m.id === id; });
  }

  document.addEventListener("click", function(e){
    var btn = e.target.closest("[data-act]");
    if(!btn) return;
    var act = btn.getAttribute("data-act");

    if(act === "toggle-beaten"){
      var key = btn.getAttribute("data-key");
      currentRun().beatenBosses[key] = !currentRun().beatenBosses[key];
      save();
      renderBosses();
      renderTrainers();
      return;
    }

    if(act === "toggle-collapse-route"){
      var routeKey = btn.getAttribute("data-route");
      currentRun().collapsedRoutes[routeKey] = !currentRun().collapsedRoutes[routeKey];
      save();
      renderChecklist();
      return;
    }

    if(act === "toggle-collapse-split"){
      var splitKey = btn.getAttribute("data-split");
      currentRun().collapsedSplits[splitKey] = !currentRun().collapsedSplits[splitKey];
      save();
      renderTrainers();
      return;
    }

    if(act === "guide-subtab"){
      activeGuideKey = btn.getAttribute("data-key");
      renderGuide();
      return;
    }

    if(act === "mark-species"){
      var route = btn.getAttribute("data-route");
      var species = btn.getAttribute("data-species");
      // A route/location can hold more than one logged catch (a gift plus
      // a wild encounter, several gifts at one town, etc) — only an exact
      // (route, species) match toggles undo; any other species tapped at
      // an already-logged location just adds another entry alongside it.
      var existing = currentRun().mons.find(function(m){
        return (m.route || "").trim().toLowerCase() === route.toLowerCase() && m.species === species;
      });

      if(existing){
        currentRun().mons = currentRun().mons.filter(function(m){ return m.id !== existing.id; });
        save(); renderAll();
        showToast("Unmarked " + species);
        return;
      }
      currentRun().mons.push({
        id: uid(),
        route: route,
        species: species,
        nick: "",
        level: "",
        status: "alive",
        cause: "",
        createdAt: Date.now()
      });
      currentRun().collapsedRoutes[route] = true; // auto-collapse once something's logged here
      save(); renderAll();
      showToast(species + " logged at " + route);
      return;
    }

    var id = btn.getAttribute("data-id");
    var mon = findMon(id);
    if(!mon) return;

    if(act === "kill"){
      showPrompt("How did " + (mon.nick || mon.species || "it") + " fall? (optional)", "", function(cause){
        mon.status = "dead";
        mon.cause = cause || "";
        showToast((mon.nick || mon.species) + " has fallen");
        save();
        renderAll();
      });
      return;
    } else if(act === "box"){
      mon.status = "boxed";
      showToast((mon.nick || mon.species) + " boxed");
    } else if(act === "unbox"){
      mon.status = "alive";
      showToast((mon.nick || mon.species) + " back in the party");
    } else if(act === "revive"){
      mon.status = "alive";
      mon.cause = "";
      showToast("Undone");
    } else if(act === "delete"){
      showConfirm("Delete this encounter permanently?", function(){
        currentRun().mons = currentRun().mons.filter(function(m){ return m.id !== id; });
        showToast("Deleted");
        save();
        renderAll();
      });
      return;
    }
    save();
    renderAll();
  });

  document.getElementById("resetBtn").addEventListener("click", function(){
    var game = currentGame();
    showConfirm("This clears your " + game.shortLabel + " run: roster, graveyard, badges. Other games' runs are untouched. Export a backup first if you want to keep it. Continue?", function(){
      state.runs[state.selectedGame] = defaultRunState();
      save();
      renderAll();
      showToast(game.shortLabel + " run reset");
    });
  });

  document.getElementById("exportBtn").addEventListener("click", function(){
    // Exports the full save — every game's run, not just the one on
    // screen — so Import Backup can restore everything at once.
    var blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    var safeName = (currentRun().runName || "nuzlocke-run").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
    a.href = url;
    a.download = (safeName || "nuzlocke-run") + "-backup.json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast("Backup downloaded");
  });

  document.getElementById("importBtn").addEventListener("click", function(){
    document.getElementById("fileInput").click();
  });

  document.getElementById("fileInput").addEventListener("change", function(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(evt){
      try{
        var parsed = JSON.parse(evt.target.result);
        var normalized = normalizeState(parsed);
        if(!normalized) throw new Error("bad format");
        state = normalized;
        save();
        populateGameSelect();
        renderAll();
        showToast("Backup restored");
      }catch(err){
        showToast("Couldn't read that file");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  });

  // ---------- init ----------
  state = load();
  populateGameSelect();
  renderAll();
})();

if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(e){
      console.warn("Service worker registration failed", e);
    });
  });
}
</script>
</body>
</html>
